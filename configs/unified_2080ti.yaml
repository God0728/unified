
# ============================================================
# Unified Transition Diffusion Model - Configuration (2080Ti)
# ============================================================
# Optimized for RTX 2080 Ti (11GB) with merged 3000-pair dataset
# Larger model + bigger batch vs. default config
# ============================================================

data:
  left_foot_dim: 3
  right_foot_dim: 3
  left_hand_dim: 3
  right_hand_dim: 3
  contact_dim: 4
  config_dim: 16
  transition_dim: 32
  use_orientation: false

  slices:
    left_foot:  [0, 3]
    right_foot: [3, 6]
    left_hand:  [6, 9]
    right_hand: [9, 12]
    contacts:   [12, 16]

  normalize: true

# --- Model Architecture (larger than default) ---
model:
  architecture: "mlp"

  # default: 256/8/6 → now: 384/8/8 (~2.5x more params)
  hidden_dim: 384
  num_heads: 8
  num_layers: 8
  dropout: 0.1
  time_embed_dim: 192

  mlp_hidden_dims: [768, 768, 768, 768]

# --- Diffusion Process ---
diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: "cosine"
  prediction_type: "epsilon"

  use_ddim: true
  ddim_steps: 50

# --- Training (bigger batch, more epochs for 3000 pairs) ---
training:
  batch_size: 512
  learning_rate: 2.0e-4
  weight_decay: 1.0e-5
  num_epochs: 50000
  warmup_steps: 1000

  w_initial: 1.0
  w_final: 1.0
  p_uncond: 0.1

  # Change mask classification loss weight
  w_change_cls: 1.0
  # Boost factor for changed effector dimensions in MSE loss
  # NOTE: kept at 1.0 (no per-dim boost) so that the "non-changed effector"
  # supervision signal isn't drowned out by the 5x weight on the flipping one.
  w_changed_dim: 1.0

  use_ema: true
  ema_decay: 0.9999

  # Translation augmentation: random 3D shift to all positions (in normalized space)
  aug_trans_scale: 0.1

  log_interval: 50
  save_interval: 2000
  eval_interval: 200

# --- Inference / Sampling ---
sampling:
  guidance_scale: 2.0
  chain:
    num_transitions: 3
    constraint_weight: 0.5
    mode: "parallel"
