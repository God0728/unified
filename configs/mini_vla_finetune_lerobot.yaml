seed: 43

model:
  embed_dim: 128
  image_size: 64
  patch_size: 8
  max_views: 1
  vocab_size: 4096
  max_text_len: 48
  state_dim: 8
  action_dim: 7
  chunk_size: 8
  text_layers: 1
  fusion_layers: 2
  num_heads: 4
  ff_dim: 512
  action_hidden_dim: 256
  dropout: 0.1
  loss_type: l1
  use_act_token: true

data:
  # Options: hf_robot / lerobot / huggingface / local_jsonl.
  # The default is intentionally a LeRobot-style public dataset name; override
  # name and column fields if the selected dataset exposes different columns.
  type: hf_robot
  name: lerobot/pusht
  image_column: observation.image
  instruction_column: task
  action_column: action
  state_column: observation.state
  train:
    split: train
    max_samples: null
  # Uncomment and adjust if the dataset has a validation split.
  # val:
  #   split: validation
  #   max_samples: 1024

train:
  output_dir: checkpoints/mini_vla_finetune_lerobot
  # Set this after synthetic pretraining, e.g.:
  # pretrained_checkpoint: checkpoints/mini_vla_pretrain_debug/checkpoint_last.pt
  pretrained_checkpoint: null
  device: cuda
  steps: 1000
  batch_size: 16
  eval_batch_size: 32
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_accum_steps: 1
  max_grad_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_every: 20
  eval_every: 200
  save_every: 500

eval:
  max_batches: 20
