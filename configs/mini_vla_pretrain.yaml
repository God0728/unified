seed: 42

model:
  embed_dim: 128
  image_size: 64
  patch_size: 8
  max_views: 1
  vocab_size: 4096
  max_text_len: 48
  state_dim: 8
  action_dim: 7
  chunk_size: 8
  text_layers: 1
  fusion_layers: 2
  num_heads: 4
  ff_dim: 512
  action_hidden_dim: 256
  dropout: 0.1
  loss_type: l1
  use_act_token: true

data:
  type: synthetic
  seed: 123
  image_size: 64
  state_dim: 8
  noise_std: 0.01
  train:
    num_samples: 2000
    seed: 123
  val:
    num_samples: 256
    seed: 999

train:
  output_dir: checkpoints/mini_vla_pretrain_debug
  device: cuda
  steps: 200
  batch_size: 16
  eval_batch_size: 32
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_accum_steps: 1
  max_grad_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_every: 10
  eval_every: 50
  save_every: 100

eval:
  max_batches: 10
